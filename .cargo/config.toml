# lld links several times faster than GNU ld, which is most of an
# incremental rebuild's wall time. Same choice as RavenViewer.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# ffmpeg-sys-next runs bindgen over the FFmpeg headers, and bindgen needs
# libclang.so at build time. `scripts/deps.sh` (run by `imlazy build` and
# `make`) installs clang system-wide, where clang-sys finds it on its own
# and libclang finds its own builtin headers.
#
# No LIBCLANG_PATH here: once that variable is set, clang-sys searches only
# the directory it names, so a path to a per-user prefix that does not exist
# on this machine fails the build with "Unable to find libclang" even with
# /usr/lib/libclang.so installed. For a libclang somewhere unusual, export
# LIBCLANG_PATH in the environment instead.
